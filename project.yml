name: Parrot
options:
  bundleIdPrefix: dev.parrot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  Parrot:
    path: .
targets:
  ParrotiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/ParrotiOS
    dependencies:
      - target: ParrotShareExtension
        embed: true
      - package: Parrot
        product: ParrotCore
      - package: Parrot
        product: ParrotEngines
      - package: Parrot
        product: ParrotSocial
      - package: Parrot
        product: ParrotPlatform
      - package: Parrot
        product: ParrotPlatformiOS
    info:
      path: Apps/iOS/ParrotiOS/Info.plist
      properties:
        CFBundleDisplayName: Parrot
        CFBundleURLTypes:
          - CFBundleURLName: dev.parrot.ios
            CFBundleURLSchemes:
              - parrot
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSPhotoLibraryUsageDescription: Parrot needs access to find the screenshot you just took for Quick Lens translation.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Apps/iOS/ParrotiOS/ParrotiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.parrot.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parrot.ios
        CODE_SIGN_STYLE: Automatic
  ParrotShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOS/ParrotShareExtension
    dependencies:
      - package: Parrot
        product: ParrotCore
      - package: Parrot
        product: ParrotSocial
      - package: Parrot
        product: ParrotPlatform
      - package: Parrot
        product: ParrotPlatformiOS
    info:
      path: Apps/iOS/ParrotShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Parrot Share
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: Apps/iOS/ParrotShareExtension/ParrotShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.parrot.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parrot.ios.share
        CODE_SIGN_STYLE: Automatic
  ParrotiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOS/ParrotiOSUITests
    dependencies:
      - target: ParrotiOS
    info:
      path: Apps/iOS/ParrotiOSUITests/Info.plist
      properties:
        CFBundleDisplayName: Parrot UI Tests
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parrot.ios.uitests
        TEST_TARGET_NAME: ParrotiOS
schemes:
  ParrotiOS:
    build:
      targets:
        ParrotiOS: all
    run:
      config: Debug
  ParrotShareExtension:
    build:
      targets:
        ParrotShareExtension: all
  ParrotiOSUITests:
    build:
      targets:
        ParrotiOS: all
        ParrotiOSUITests: test
    test:
      targets:
        - name: ParrotiOSUITests
