<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parrot App Icon Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #f5f6fa;
      color: #151923;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(920px, calc(100vw - 48px));
      display: grid;
      gap: 28px;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(260px, 440px) 1fr;
      gap: 36px;
      align-items: center;
    }

    .tile {
      display: grid;
      place-items: center;
      min-height: 480px;
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(226, 232, 243, 0.62)),
        #eef2f8;
      box-shadow: 0 22px 80px rgba(27, 36, 65, 0.14);
    }

    .tile img {
      width: min(76%, 360px);
      height: auto;
    }

    .sizes {
      display: flex;
      align-items: end;
      gap: 18px;
      flex-wrap: wrap;
    }

    .sizes img {
      image-rendering: auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      max-width: 420px;
      color: #586174;
      font-size: 15px;
      line-height: 1.55;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .stage {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage">
      <div class="tile">
        <img src="parrot-app-icon-1024.png" alt="Parrot app icon">
      </div>
      <div>
        <h1>Parrot App Icon</h1>
        <p>
          Native macOS square icon with a restrained translation bubble, a subtle parrot beak,
          and OCR scan corners. Source: <code>parrot-app-icon.svg</code>.
        </p>
      </div>
    </section>
    <section class="sizes" aria-label="Small size previews">
      <img src="parrot-app-icon-1024.png" width="128" height="128" alt="128 px preview">
      <img src="parrot-app-icon-1024.png" width="64" height="64" alt="64 px preview">
      <img src="parrot-app-icon-1024.png" width="32" height="32" alt="32 px preview">
      <img src="parrot-app-icon-1024.png" width="16" height="16" alt="16 px preview">
    </section>
  </main>
</body>
</html>
