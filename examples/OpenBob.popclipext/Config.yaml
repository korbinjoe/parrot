# OpenBob PopClip Extension
# Install: double-click this folder (zip → rename to OpenBob.popclipextz) or drag into PopClip.
# Adds two actions to the PopClip bar that hand the selected text to OpenBob via its URL scheme.
name: OpenBob
identifier: com.openbob.popclip
description: Translate or look up the selected text with OpenBob.
icon: square.fill OB
actions:
  - title: OpenBob 翻译
    icon: symbol:character.bubble
    url: openbob://translate?text={popclip text}
  - title: OpenBob 查词
    icon: symbol:book
    url: openbob://lookup?text={popclip text}
